# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 5 * * 2,5"
      timezone: Etc/UTC
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "22 2 * * 1,4"
      timezone: Etc/UTC
